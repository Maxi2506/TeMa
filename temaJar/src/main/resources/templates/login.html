<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Optimización CV</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .register-link { text-align: center; margin-top: 15px; display: block; color: #555; text-decoration: none; }
    </style>
</head>
<body>

<h2>Ingresar a mi Cuenta</h2>

<form id="loginForm">
    <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" name="correo" placeholder="ejemplo@correo.com" required />
    </div>
    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="clave" placeholder="••••••••" required />
    </div>
    <button type="submit">Iniciar Sesión</button>
</form>

<a th:href="@{/vistas/registro-usuario}" class="register-link">¿No tienes cuenta? Regístrate aquí</a>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = Object.fromEntries(new FormData(e.target).entries());

        const response = await fetch('/usuario/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            // ✨ Redirección corregida hacia el nuevo Index/Panel de usuario
            window.location.href = '/vistas/index';
        } else {
            alert("Credenciales incorrectas. Inténtalo de nuevo.");
        }
    });
</script>
</body>
</html>
