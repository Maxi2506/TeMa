<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario - Optimización CV</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<h2>Registro de Nuevo Usuario</h2>

<form id="registroForm">
    <div class="form-group"><label>Nombre</label><input type="text" name="nombre" required /></div>
    <div class="form-group"><label>Apellido</label><input type="text" name="apellido" required /></div>
    <div class="form-group"><label>Edad</label><input type="number" name="edad" required /></div>
    <div class="form-group"><label>Correo</label><input type="email" name="correo" required /></div>
    <div class="form-group"><label>Contraseña</label><input type="password" name="clave" required /></div>
    <div class="form-group"><label>Teléfono</label><input type="number" name="telefono" required /></div>
    <div class="form-group"><label>Domicilio</label><input type="text" name="domicilio" required /></div>

    <hr>
    <div class="form-group">
        <label>País</label>
        <select id="select-pais" name="pais" required>
            <option value="">Seleccione un país...</option>
            <option th:each="p : ${listaPaises}" th:value="${p.nombre}" th:text="${p.nombre}"></option>
        </select>
    </div>
    <div class="form-group">
        <label>Provincia</label>
        <select id="select-provincia" name="provincia" required>
            <option value="">Seleccione primero un país</option>
        </select>
    </div>
    <div class="form-group">
        <label>Localidad</label>
        <select id="select-localidad" name="localidad" required>
            <option value="">Seleccione primero una provincia</option>
        </select>
    </div>
    <button type="submit">Crear Mi Cuenta</button>
</form>

<select id="master-provincias" style="display: none;">
    <option th:each="p : ${listaProvincias}" th:value="${p.nombre}" th:text="${p.nombre}" th:data-pais="${p.nombrePais}"></option>
</select>
<select id="master-localidades" style="display: none;">
    <option th:each="l : ${listaLocalidades}" th:value="${l.nombre}" th:text="${l.nombre}" th:data-provincia="${l.nombreProvincia}"></option>
</select>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const selectPais = document.getElementById('select-pais');
        const selectProv = document.getElementById('select-provincia');
        const selectLoc = document.getElementById('select-localidad');

        const masterProv = document.getElementById('master-provincias');
        const masterLoc = document.getElementById('master-localidades');

        // --- FILTRADO DINÁMICO ---
        selectPais.addEventListener('change', function() {
            const paisSeleccionado = this.value;

            selectProv.innerHTML = '<option value="">Seleccione Provincia...</option>';
            selectLoc.innerHTML = '<option value="">Seleccione primero una provincia</option>';

            if (paisSeleccionado) {
                Array.from(masterProv.options).forEach(opt => {
                    if (opt.getAttribute('data-pais') === paisSeleccionado) {
                        selectProv.add(new Option(opt.text, opt.value));
                    }
                });
            }
        });

        selectProv.addEventListener('change', function() {
            const provSeleccionada = this.value;

            selectLoc.innerHTML = '<option value="">Seleccione Localidad...</option>';

            if (provSeleccionada) {
                Array.from(masterLoc.options).forEach(opt => {
                    if (opt.getAttribute('data-provincia') === provSeleccionada) {
                        selectLoc.add(new Option(opt.text, opt.value));
                    }
                });
            }
        });

        // --- ENVÍO DE DATOS AL CONTROLLER VIA FETCH ---
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // FormData mapeará automáticamente los campos usando los atributos 'name' del HTML
            const data = Object.fromEntries(new FormData(e.target).entries());

            const response = await fetch('/usuario/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("¡Usuario registrado con éxito en la base de datos!");
                window.location.reload();
            } else {
                alert("Error al registrar. Verifica los datos.");
            }
        });
    });
</script>
</body>
</html>
