<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Seleccionar Categoría - NovaTech CV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header h2 {
      margin: 0;
      color: #1a1a2e;
      font-size: 24px;
    }
    .header a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .header a:hover { text-decoration: underline; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
    }
    .card h3 {
      margin-top: 0;
      color: #374151;
      font-size: 18px;
    }
    .info-box {
      background: #eef2ff;
      border-left: 4px solid #4f46e5;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 25px;
      color: #3730a3;
      font-size: 14px;
    }
    .error-box {
      background: #fee2e2;
      border-left: 4px solid #dc2626;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      color: #991b1b;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background-color: white;
      color: #1f2937;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #4338ca; }
    .cv-preview {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
    }
    .cv-preview h4 {
      margin: 0 0 8px 0;
      color: #6b7280;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cv-preview p {
      margin: 0;
      color: #1f2937;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>🎯 Adaptar Currículum</h2>
    <a th:href="@{/vistas/index}">← Volver al Inicio</a>
  </div>

  <div class="card">
    <!-- Info del CV que se va a adaptar -->
    <div class="cv-preview">
      <h4>Documento seleccionado</h4>
      <p th:text="${cv != null and cv.nombreArchivo != null ? cv.nombreArchivo : 'CV sin nombre'}">Nombre del CV</p>
    </div>

    <!-- Mensaje de error si existe -->
    <div th:if="${error}" class="error-box" th:text="${error}">
      Error al procesar
    </div>

    <div class="info-box">
      Seleccioná la categoría de perfil profesional para la que querés adaptar este CV. La IA optimizará el contenido destacando las habilidades y experiencias más relevantes para ese puesto.
    </div>

    <!-- 🔴 IMPORTANTE: el idCvArchivo va DENTRO del form y con th:value seguro -->
    <form th:action="@{/adaptar-cv}" method="POST">

      <input type="hidden" name="idCvArchivo"
             th:value="${cv != null and cv.id != null ? cv.id : ''}" />

      <div class="form-group">
        <label for="categoria">Categoría de Perfil Profesional</label>
        <select name="categoria" id="categoria" required>
          <option value="" disabled selected>Seleccioná una categoría...</option>

          <option th:each="cat : ${categorias}"
                  th:value="${cat}"
                  th:text="${#strings.replace(cat.name(), '_', ' ')}">
            CATEGORIA
          </option>
        </select>
      </div>

      <button type="submit" class="btn">✨ Generar CV Adaptado</button>
    </form>
  </div>
</div>

</body>
</html>
