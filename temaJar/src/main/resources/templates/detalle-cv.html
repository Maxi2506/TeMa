<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te-ma | CV Procesado</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: "#333333",
            background: "#1A1A1A",
            foreground: "#F2F2F2",
            primary: { DEFAULT: "#87D37C", foreground: "#1A1A1A" },
            secondary: { DEFAULT: "#333333", foreground: "#A0A0A0" },
            muted: { DEFAULT: "#333333", foreground: "#A0A0A0" },
            card: { DEFAULT: "#222222" }
          }
        }
      }
    }
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
    .delay-1 { animation-delay: 80ms; }
    .delay-2 { animation-delay: 160ms; }
    .delay-3 { animation-delay: 240ms; }
    .delay-4 { animation-delay: 320ms; }
    .opacity-0 { opacity: 0; }
  </style>
</head>
<body class="flex flex-col min-h-screen bg-background text-foreground font-sans">

<!-- Header -->
<header class="px-6 h-16 flex items-center justify-between border-b border-border backdrop-blur-md sticky top-0 z-50 bg-background/80">
  <div class="flex items-center gap-2">
    <div class="p-1.5 bg-primary rounded-lg text-primary-foreground">
      <i data-lucide="wand-2" class="w-6 h-6"></i>
    </div>
    <span class="text-xl font-bold tracking-tight text-primary">Te-ma</span>
  </div>
  <div class="flex items-center gap-4">
    <a th:href="@{/vistas/index}" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors flex items-center gap-1">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel
    </a>
    <a th:href="@{/vistas/seleccion-categoria(id=${cv.id})}" class="text-sm font-medium text-primary hover:text-primary/80 transition-colors flex items-center gap-1">
      <i data-lucide="sparkles" class="w-4 h-4"></i> Adaptar CV
    </a>
  </div>
</header>

<main class="flex-1 px-6 py-10 max-w-5xl mx-auto">

  <!-- Título -->
  <div class="mb-8 animate-fade-in">
    <div class="inline-flex items-center gap-2 mb-3 px-3 py-1 bg-primary/10 text-primary rounded-full text-xs font-semibold tracking-wide uppercase border border-primary/20">
      <i data-lucide="file-text" class="w-3 h-3"></i> CV Procesado
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-foreground">Contenido Extraído del CV</h1>
    <p class="text-muted-foreground mt-2">Archivo: <span th:text="${cv.nombreArchivo} ?: 'CV subido'" class="text-foreground font-medium">cv.pdf</span></p>
  </div>

  <!-- Error -->
  <div th:if="${error}" class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm animate-fade-in">
    <i data-lucide="alert-circle" class="w-4 h-4 inline mr-1"></i>
    <span th:text="${error}">Error</span>
  </div>

  <!-- Contenedor donde JS inyecta el contenido parseado -->
  <div id="cv-container" class="space-y-6">
    <div class="text-center py-12 text-muted-foreground text-sm">Cargando análisis...</div>
  </div>

</main>

<footer class="py-6 px-6 border-t border-border bg-background mt-auto">
  <div class="max-w-5xl mx-auto text-center">
    <p class="text-sm text-muted-foreground">© 2026 Te-ma. Procesamiento de CV con IA.</p>
  </div>
</footer>

<script th:inline="javascript">
  // ✅ CAMPO CORREGIDO: textoExtraido
  var contenidoRaw = /*[[${cv.textoExtraido}]]*/ '{}';

  let cvData;
  try {
    cvData = (typeof contenidoRaw === 'string') ? JSON.parse(contenidoRaw) : contenidoRaw;
  } catch (e) {
    console.error("Error parseando JSON del CV:", e);
    document.getElementById('cv-container').innerHTML = `
      <div class="bg-card rounded-xl border border-border p-6">
        <p class="text-sm text-muted-foreground mb-2">No se pudo estructurar el contenido. Vista cruda:</p>
        <pre class="text-xs text-muted-foreground whitespace-pre-wrap bg-background p-4 rounded-lg border border-border">${String(contenidoRaw).replace(/</g,'&lt;')}</pre>
      </div>
    `;
    throw e;
  }

  const container = document.getElementById('cv-container');

  function section(title, icon, html, delay) {
    return `<div class="bg-card rounded-xl border border-border p-6 animate-fade-in ${delay} opacity-0">
      <div class="flex items-center gap-3 mb-5">
        <div class="p-2 bg-primary/10 rounded-lg"><i data-lucide="${icon}" class="w-5 h-5 text-primary"></i></div>
        <h2 class="text-lg font-bold text-foreground">${title}</h2>
      </div>${html}</div>`;
  }

  function field(label, value, isLink) {
    if (!value) return '';
    const val = isLink ? `<a href="${value}" target="_blank" class="text-primary hover:underline break-all">${value}</a>` : `<span class="text-foreground font-medium break-all">${value}</span>`;
    return `<div class="flex flex-col sm:flex-row sm:justify-between py-3 border-b border-border/50 last:border-0 gap-1"><span class="text-sm text-muted-foreground min-w-[140px]">${label}</span>${val}</div>`;
  }

  // --- Datos Personales ---
  let personal = '';
  personal += field('Nombre', cvData.nombre);
  personal += field('Email', cvData.email);
  personal += field('Teléfono', cvData.telefono);
  personal += field('Dirección', cvData.direccion);
  personal += field('LinkedIn', cvData.linkedin, true);
  personal += field('GitHub', cvData.github, true);
  if (cvData.resumen_profesional) {
    personal += `<div class="mt-4 pt-4 border-t border-border/50"><span class="text-sm text-muted-foreground block mb-2">Resumen Profesional</span><p class="text-sm text-foreground leading-relaxed">${cvData.resumen_profesional}</p></div>`;
  }
  container.innerHTML = section('Datos Personales', 'user', personal, 'delay-1');

  // --- Habilidades ---
  if (cvData.habilidades_tecnicas && cvData.habilidades_tecnicas.length) {
    const skills = `<div class="flex flex-wrap gap-2">${cvData.habilidades_tecnicas.map(h => `<span class="px-3 py-1.5 rounded-full text-xs font-semibold bg-primary/10 text-primary border border-primary/20">${h}</span>`).join('')}</div>`;
    container.innerHTML += section('Habilidades Técnicas', 'cpu', skills, 'delay-2');
  }

  // --- Experiencia ---
  if (cvData.experiencia_laboral && cvData.experiencia_laboral.length) {
    const exp = cvData.experiencia_laboral.map(e => `
      <div class="py-4 border-b border-border/50 last:border-0">
        <div class="flex flex-col sm:flex-row sm:justify-between gap-1 mb-1">
          <h3 class="text-sm font-bold text-foreground">${e.puesto || 'Puesto'}</h3>
          <span class="text-xs text-primary font-medium bg-primary/10 px-2 py-0.5 rounded border border-primary/20 whitespace-nowrap">${e.periodo || ''}</span>
        </div>
        <p class="text-sm text-muted-foreground">${e.empresa || ''}</p>
      </div>`).join('');
    container.innerHTML += section('Experiencia Laboral', 'briefcase', exp, 'delay-3');
  }

  // --- Educación ---
  if (cvData.educacion && cvData.educacion.length) {
    const edu = cvData.educacion.map(e => `
      <div class="py-3 border-b border-border/50 last:border-0 flex items-start gap-3">
        <div class="p-1.5 bg-secondary rounded-md mt-0.5"><i data-lucide="graduation-cap" class="w-4 h-4 text-primary"></i></div>
        <p class="text-sm text-foreground leading-relaxed">${e}</p>
      </div>`).join('');
    container.innerHTML += section('Educación', 'book-open', edu, 'delay-4');
  }

  lucide.createIcons();
</script>

</body>
</html>
